name: Deploy Pages

on:
  # 코드 push (내 커밋)
  push:
    branches: [main]
  # "Daily puzzle" 크론이 daily/*.json 을 커밋한 뒤에도 재배포
  # (GITHUB_TOKEN 봇 커밋의 push는 다른 워크플로를 직접 트리거하지 못하므로 workflow_run 사용)
  workflow_run:
    workflows: ["Daily puzzle"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # "Daily puzzle" 트리거는 그 실행이 성공했을 때만 (실패/무변경 재배포 방지)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css .nojekyll icon.svg manifest.webmanifest src daily _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  # 이 게임을 담은 ProjectDaily 허브(/ProjectDaily/)도 바로 재배포 — 코드 push·매일 퍼즐 커밋 모두
  # 다른 레포의 워크플로를 실행하려면 PAT가 필요하다: 시크릿 HUB_DEPLOY_TOKEN
  # (fine-grained, 저장소 nuclyee72/ProjectDaily 하나, 권한 Actions: Read and write)
  notify-hub:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger ProjectDaily deploy
        env:
          GH_TOKEN: ${{ secrets.HUB_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HUB_DEPLOY_TOKEN 시크릿이 없어 허브 재배포를 건너뜀 (허브는 6시간마다 자동 배포)"
            exit 0
          fi
          gh workflow run pages.yml -R nuclyee72/ProjectDaily
